# Platform-independent environment (Linux, macOS, Windows).
# Only the direct dependencies are pinned, to the versions used for the published results;
# platform-specific system libraries are resolved by conda/pip for each platform.
# The exact Linux environment used for the published results is provided in environment_linux-64.yml.
name: De_novo_eval
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  - pip:
      - adjustText==1.3.0
      - fastparquet==2024.11.0
      - lxml==5.3.1
      - matplotlib==3.10.0
      - matplotlib-venn==1.1.1
      - numpy==2.1.3
      - pandas==2.2.3
      - pyteomics==4.7.5
      - scikit-learn==1.6.1
      - spectrum-utils==0.4.2
      - tqdm==4.67.1
      - upsetplot==0.9.0  # UpSet plots
      - venn==0.1.3  # "pyvenn", used for 4-6 set Venn diagrams
